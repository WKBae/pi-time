name: Stage package for npm

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  stage:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '^24.15.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm
        run: npm install --global 'npm@^12.2.0'

      - name: Verify release version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const expectedTag = `v${version}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Release tag must be ${expectedTag}, got ${process.env.GITHUB_REF_NAME}`);
          }

          const distTag = version.includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_ENV, `NPM_DIST_TAG=${distTag}\n`);
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check and stage package
        run: npm stage publish --access public --tag "$NPM_DIST_TAG"
